# FIX NHANH - Prometheus alert rules cho Proxmox + Ceph (pve_ceph_extra_exporter)
# Ban quyen (c) 2026 FIX NHANH. Bao luu moi quyen.
#
# Cai: chep file vao thu muc rules cua Prometheus, them vao prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/pve-ceph-alerts.yml
# Kiem tra: promtool check rules pve-ceph-alerts.yml
# Chi ap cho job chua "Proxmox-" (giong bien $job cua dashboard).

groups:
  - name: pve-ceph-exporter
    rules:
      - alert: PveCephExporterDown
        # Chi target cua pve_ceph_extra_exporter (tung xuat build_info trong 1 ngay qua):
        # bo qua mgr standby / pve exporter cu cua cac job scrape thang (luon co target down)
        expr: |
          (up{job=~".*Proxmox-.*"} == 0)
          and on(job, instance) max_over_time(pve_ceph_extra_exporter_build_info[1d])
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} ({{ $labels.job }}) cannot be scraped"
          description: "Prometheus cannot fetch /metrics. Check the exporter service / container and the firewall (menu 26, 22)."

      - alert: PveCephExporterCollectorFailed
        expr: pve_ceph_extra_exporter_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector {{ $labels.collector }} of {{ $labels.job }} is failing"
          description: "Dashboard panels using this collector show No data. Error: pve_ceph_extra_exporter_last_error{job=\"{{ $labels.job }}\"} or menu 19 / 26."

      - alert: PveCephExporterStale
        expr: time() - pve_ceph_extra_exporter_last_collect_timestamp > 180
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Exporter {{ $labels.instance }} has not collected for > 3 minutes"
          description: "The background collection is hung (ceph command / Proxmox API not answering). Restart it (menu 26) or enable the watchdog."

  - name: ceph
    rules:
      - alert: CephHealthError
        expr: ceph_health_status == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ceph {{ $labels.job }} HEALTH_ERR"
          description: "See the Detailed Alarms table on the dashboard or 'ceph health detail'."

      - alert: CephHealthWarning
        expr: ceph_health_status == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph {{ $labels.job }} HEALTH_WARN for 15 minutes"

      - alert: CephOsdDown
        expr: ceph_osd_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.ceph_daemon }} of {{ $labels.job }} is DOWN"

      - alert: CephOsdOut
        expr: ceph_osd_in == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ceph_daemon }} of {{ $labels.job }} has been OUT for 15 minutes"

      - alert: CephOsdNearFull
        expr: ceph_osd_stat_bytes_used / ceph_osd_stat_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ceph_daemon }} of {{ $labels.job }} is at {{ $value | printf \"%.1f\" }}%"
          description: "Ceph defaults: nearfull 85%, backfillfull 90%, full 95% (writes stop)."

      - alert: CephOsdFull
        expr: ceph_osd_stat_bytes_used / ceph_osd_stat_bytes * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.ceph_daemon }} of {{ $labels.job }} is at {{ $value | printf \"%.1f\" }}% (>= backfillfull)"

      - alert: CephPoolNearFull
        expr: ceph_pool_percent_used > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pool id {{ $labels.pool_id }} of {{ $labels.job }} is at {{ $value | humanizePercentage }}"

      - alert: CephPgInconsistent
        expr: sum by (job) (ceph_pg_inconsistent) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has {{ $value }} inconsistent PGs"
          description: "Needs 'ceph pg repair'. See 'ceph health detail'."

      - alert: CephUnfoundObjects
        expr: ceph_custom_unfound_objects > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has {{ $value }} unfound objects"
          description: "Risk of data loss. See 'ceph health detail' and 'ceph pg <pgid> list_unfound'."

      - alert: CephRecoveryTooLong
        expr: ceph_custom_recovery_percent < 100
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Recovery / rebalance of {{ $labels.job }} running for over 6 hours ({{ $value | printf \"%.2f\" }}%)"

      - alert: CephOsdHighLatency
        expr: ceph_osd_apply_latency_ms > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ceph_daemon }} of {{ $labels.job }} latency {{ $value }} ms for 10 minutes"

  - name: proxmox
    rules:
      - alert: PveNodeDown
        expr: pve_up{id=~"node/.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.id }} of {{ $labels.job }} is offline"

      - alert: PveClusterNotQuorate
        expr: pve_cluster_info{quorate!="1"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cluster {{ $labels.id }} ({{ $labels.job }}) lost quorum"
          description: "/etc/pve is read-only, VMs cannot be started / migrated."

      - alert: PveHaNodeFenced
        expr: pve_ha_state{state=~"fence|lost|gone|unknown"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HA: {{ $labels.id }} of {{ $labels.job }} is in state {{ $labels.state }}"

      - alert: PveNodeHighCpu
        expr: pve_cpu_usage_ratio{id=~"node/.*"} > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} of {{ $labels.job }} CPU {{ $value | humanizePercentage }} for 15 minutes"

      - alert: PveNodeHighMemory
        expr: pve_memory_usage_bytes{id=~"node/.*"} / pve_memory_size_bytes{id=~"node/.*"} > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} of {{ $labels.job }} RAM {{ $value | humanizePercentage }} for 15 minutes"
