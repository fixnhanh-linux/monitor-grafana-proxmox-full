<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>Proxmox + Ceph monitoring: Prometheus / Grafana and Zabbix</title>
  <desc>Proxmox + Ceph clusters are monitored two ways: a pve_ceph_extra_exporter on a monitor host scraped by Prometheus and shown in Grafana, and Zabbix Agent 2 on every node polled by Zabbix.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      .t  { font-size: 13px; fill: #0f172a; }
      .s  { font-size: 11px; fill: #334155; }
      .m  { font-size: 11px; fill: #334155; font-family: Consolas, Menlo, monospace; }
      .h  { font-size: 14px; font-weight: 700; letter-spacing: .4px; }
      .lb { font-size: 11px; fill: #475569; }
      .lz { font-size: 11px; fill: #c2410c; }
      .flow  { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); stroke-dasharray: 6 4; animation: f 1.2s linear infinite; }
      .zflow { stroke: #c2410c; stroke-width: 1.6; fill: none; marker-end: url(#az); stroke-dasharray: 6 4; animation: f 1.2s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <rect width="1120" height="860" fill="#ffffff"/>
  <text x="560" y="34" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#0f172a">Proxmox + Ceph monitoring  ·  Prometheus → Grafana  ·  Zabbix</text>
  <text x="560" y="56" text-anchor="middle" class="s">Moving arrows = data flow. Prometheus and Zabbix pull; the monitor host also pushes config (SSH) and dashboards (Grafana API).</text>

  <!-- ===================== PROXMOX + CEPH CLUSTER ===================== -->
  <rect x="20" y="80" width="330" height="560" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="185" y="104" text-anchor="middle" class="h" fill="#1d4ed8">PROXMOX + CEPH CLUSTER</text>
  <text x="185" y="121" text-anchor="middle" class="s">one per site (P1-XD, FPT01-FPT02, Deco ...)</text>

  <rect x="40" y="135" width="290" height="62" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="185" y="156" text-anchor="middle" class="t">Ceph  MON · MGR (active / standby) · OSD</text>
  <text x="185" y="174" text-anchor="middle" class="s">health · pgmap · OSD · pools · latency</text>
  <text x="185" y="189" text-anchor="middle" class="s">nvme / ssd / hdd device classes</text>

  <rect x="40" y="210" width="290" height="50" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="185" y="230" text-anchor="middle" class="t">ceph-mgr prometheus  :9283/metrics</text>
  <text x="185" y="248" text-anchor="middle" class="m">ceph_health_status · ceph_osd_* · ceph_pool_*</text>

  <rect x="40" y="272" width="290" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="185" y="292" text-anchor="middle" class="t">Proxmox API  :8006</text>
  <text x="185" y="309" text-anchor="middle" class="s">read-only token monitor@pve!exporter (PVEAuditor)</text>
  <text x="185" y="325" text-anchor="middle" class="m">/cluster/status · resources · ha · ceph</text>

  <rect x="40" y="346" width="290" height="50" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="185" y="366" text-anchor="middle" class="t">ceph-mgr restful  :8003</text>
  <text x="185" y="384" text-anchor="middle" class="s">API key zabbix-monitor · self-signed cert</text>

  <rect x="40" y="410" width="290" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="185" y="430" text-anchor="middle" class="t">every node: zabbix-agent2  :10050</text>
  <text x="185" y="448" text-anchor="middle" class="s">Ceph plugin → restful :8003</text>
  <text x="185" y="466" text-anchor="middle" class="s">cron every minute: ceph health →</text>
  <text x="185" y="482" text-anchor="middle" class="m">/etc/zabbix/cephstatus.txt</text>
  <text x="185" y="498" text-anchor="middle" class="s">(fallback, read with vfs.file.contents)</text>

  <rect x="40" y="520" width="290" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="185" y="540" text-anchor="middle" class="t">optional local mode (on a Ceph node)</text>
  <text x="185" y="558" text-anchor="middle" class="s">pve-ceph-extra-exporter.service :9830</text>
  <text x="185" y="574" text-anchor="middle" class="s">reads ceph status, pvesh, /etc/pve/ha</text>
  <text x="185" y="590" text-anchor="middle" class="s">menu 2 / S  ·  exporter/install_exporter.sh</text>
  <text x="185" y="608" text-anchor="middle" class="s">nothing is installed on nodes in remote mode</text>

  <!-- ===================== MONITOR HOST ===================== -->
  <rect x="395" y="80" width="330" height="560" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="104" text-anchor="middle" class="h" fill="#15803d">MONITOR HOST</text>
  <text x="560" y="121" text-anchor="middle" class="s">e.g. 10.16.16.38 (Ubuntu) · repo monitor-grafana-proxmox-full</text>

  <rect x="415" y="135" width="290" height="50" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="560" y="155" text-anchor="middle" class="t">proxmox-menu  (menu.sh)</text>
  <text x="560" y="173" text-anchor="middle" class="s">setup · refresh · services · prom-push · zabbix-ceph</text>

  <rect x="415" y="198" width="290" height="122" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="218" text-anchor="middle" class="t">pve_ceph_extra_exporter  (exporter/)</text>
  <text x="560" y="236" text-anchor="middle" class="s">one per cluster, all metrics on one port:</text>
  <text x="560" y="253" text-anchor="middle" class="m">:9830 P1-XD · :9831 FPT01-FPT02 · :9832 Deco</text>
  <text x="560" y="270" text-anchor="middle" class="s">systemd @name or Docker fixnhanh-pve-&lt;name&gt;</text>
  <text x="560" y="287" text-anchor="middle" class="s">re-serves mgr metrics + Proxmox + recovery / HA</text>
  <text x="560" y="304" text-anchor="middle" class="m">/metrics · /health</text>

  <rect x="415" y="333" width="290" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="560" y="352" text-anchor="middle" class="t">watchdog timer (every 2 min)</text>
  <text x="560" y="368" text-anchor="middle" class="s">/health failing twice → restart that exporter</text>

  <rect x="415" y="390" width="290" height="62" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="560" y="410" text-anchor="middle" class="t">dashboard-grafana/make_dashboard.py</text>
  <text x="560" y="427" text-anchor="middle" class="s">dashboard-local.json · dashboard-&lt;name&gt;.json</text>
  <text x="560" y="443" text-anchor="middle" class="s">internal / customer · saved args (fixnhanhArgs)</text>

  <rect x="415" y="465" width="290" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="560" y="484" text-anchor="middle" class="t">prometheus/pve-ceph-alerts.yml</text>
  <text x="560" y="500" text-anchor="middle" class="s">19 alert rules: exporter · Ceph · Proxmox</text>

  <rect x="415" y="522" width="290" height="102" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="560" y="542" text-anchor="middle" class="t">template-zabbix/</text>
  <text x="560" y="560" text-anchor="middle" class="m">setup_ceph_zabbix.sh</text>
  <text x="560" y="576" text-anchor="middle" class="s">SSH to nodes: agent2, cron, restful API key</text>
  <text x="560" y="594" text-anchor="middle" class="m">pve-ceph-exporter-by-http · ceph-health-fallback</text>
  <text x="560" y="610" text-anchor="middle" class="s">menu 27 · prints the 3 Zabbix macros</text>

  <!-- ===================== PROMETHEUS ===================== -->
  <rect x="770" y="80" width="330" height="190" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="935" y="104" text-anchor="middle" class="h" fill="#be123c">PROMETHEUS</text>
  <text x="935" y="121" text-anchor="middle" class="s">e.g. 10.16.16.24:9090 · one per site</text>
  <rect x="790" y="135" width="290" height="44" rx="8" fill="#ffffff" stroke="#e11d48"/>
  <text x="935" y="154" text-anchor="middle" class="m">scrape_configs/proxmox-ceph-&lt;host&gt;.yml</text>
  <text x="935" y="170" text-anchor="middle" class="s">job Proxmox-&lt;cluster&gt; → 1 target monitor:port</text>
  <rect x="790" y="190" width="290" height="62" rx="8" fill="#ffffff" stroke="#e11d48"/>
  <text x="935" y="209" text-anchor="middle" class="m">rules/pve-ceph-alerts.yml</text>
  <text x="935" y="226" text-anchor="middle" class="s">promtool checked, restored on error</text>
  <text x="935" y="243" text-anchor="middle" class="s">→ Alertmanager (Telegram / email)</text>

  <!-- ===================== GRAFANA ===================== -->
  <rect x="770" y="300" width="330" height="200" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="935" y="324" text-anchor="middle" class="h" fill="#b45309">GRAFANA</text>
  <text x="935" y="341" text-anchor="middle" class="s">datasource per site → variable $Site</text>
  <rect x="790" y="355" width="290" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="374" text-anchor="middle" class="t">Internal dashboard</text>
  <text x="935" y="390" text-anchor="middle" class="s">$Site · $job · $class · Exporter row · alarms</text>
  <rect x="790" y="408" width="290" height="44" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="427" text-anchor="middle" class="t">Customer dashboards</text>
  <text x="935" y="443" text-anchor="middle" class="s">locked job + datasource · read-only · own folder</text>
  <text x="935" y="476" text-anchor="middle" class="s">health · capacity · OSD · pools · latency</text>
  <text x="935" y="492" text-anchor="middle" class="s">nodes CPU / RAM · HA Groups · recovery</text>

  <!-- ===================== ZABBIX ===================== -->
  <rect x="770" y="530" width="330" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="935" y="554" text-anchor="middle" class="h" fill="#b91c1c">ZABBIX SERVER / PROXY</text>
  <text x="935" y="571" text-anchor="middle" class="s">e.g. 10.8.10.201</text>
  <rect x="790" y="585" width="290" height="58" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="935" y="604" text-anchor="middle" class="t">Template: Ceph by Zabbix agent 2</text>
  <text x="935" y="621" text-anchor="middle" class="m">{$CEPH.API.KEY} {$CEPH.USER}</text>
  <text x="935" y="636" text-anchor="middle" class="m">{$CEPH.API.URL} = https://mgr:8003</text>
  <rect x="790" y="652" width="290" height="52" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="935" y="671" text-anchor="middle" class="t">Templates: exporter by HTTP · fallback</text>
  <text x="935" y="688" text-anchor="middle" class="m">HTTP monitor:9830/metrics · vfs.file.*</text>

  <!-- ===================== FLOWS ===================== -->
  <!-- exporter keo du lieu tu mgr + API -->
  <path class="flow" d="M415,236 C380,236 370,236 332,236"/>
  <text x="372" y="229" text-anchor="middle" class="lb">pull</text>
  <path class="flow" d="M415,262 C385,280 370,300 332,302"/>
  <text x="376" y="300" text-anchor="middle" class="lb">API</text>
  <!-- Prometheus scrape exporter -->
  <path class="flow" d="M790,158 C740,160 740,230 707,240"/>
  <text x="742" y="190" text-anchor="middle" class="lb">scrape</text>
  <!-- Grafana -> Prometheus -->
  <path class="flow" d="M935,355 C935,320 935,300 935,272"/>
  <text x="960" y="292" class="lb">PromQL</text>
  <!-- menu day cau hinh / dashboard -->
  <path class="flow" d="M707,160 C735,160 755,215 788,220"/>
  <text x="750" y="140" text-anchor="middle" class="lb">SSH push</text>
  <path class="flow" d="M707,421 C740,421 755,420 788,420"/>
  <text x="748" y="414" text-anchor="middle" class="lb">API import</text>
  <path class="flow" d="M707,487 C740,487 750,250 788,232"/>
  <!-- Zabbix -->
  <path class="zflow" d="M790,615 C620,650 480,660 332,470"/>
  <text x="560" y="676" text-anchor="middle" class="lz">Zabbix polls agent2 :10050</text>
  <path class="zflow" d="M185,410 C185,404 185,402 185,398"/>
  <path class="zflow" d="M415,560 C380,560 370,520 332,500"/>
  <text x="372" y="548" text-anchor="middle" class="lz">SSH setup</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="20" y="740" width="1080" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="764" class="h" fill="#0f172a">Legend</text>
  <rect x="40" y="776" width="16" height="12" fill="#fff7ed" stroke="#f97316"/><text x="62" y="786" class="s">Ceph (mgr, restful)</text>
  <rect x="190" y="776" width="16" height="12" fill="#dbeafe" stroke="#3b82f6"/><text x="212" y="786" class="s">Proxmox API</text>
  <rect x="310" y="776" width="16" height="12" fill="#dcfce7" stroke="#16a34a"/><text x="332" y="786" class="s">extra exporter</text>
  <rect x="440" y="776" width="16" height="12" fill="#fff1f2" stroke="#e11d48"/><text x="462" y="786" class="s">Prometheus</text>
  <rect x="560" y="776" width="16" height="12" fill="#fffbeb" stroke="#d97706"/><text x="582" y="786" class="s">Grafana</text>
  <rect x="660" y="776" width="16" height="12" fill="#fef2f2" stroke="#dc2626"/><text x="682" y="786" class="s">Zabbix</text>
  <rect x="760" y="776" width="16" height="12" fill="#ffffff" stroke="#64748b"/><text x="782" y="786" class="s">tool / install</text>
  <text x="40" y="812" class="s">Repo layout: menu.sh · exporter/ · dashboard-grafana/ · prometheus/ · template-zabbix/ · docs/ · tests/</text>
  <text x="40" y="829" class="s">Update everything: proxmox-menu refresh  ·  Zabbix setup: proxmox-menu zabbix-ceph</text>
</svg>
