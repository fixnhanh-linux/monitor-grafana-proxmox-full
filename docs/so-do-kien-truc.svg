<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 880" width="1400" height="880" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Sơ đồ giám sát Proxmox + Ceph (Prometheus / Grafana)</title>
  <defs>
    <style>
      .bg      { fill: #0b1220; }
      .panel   { fill: #111a2e; stroke: #2a3a5c; stroke-width: 1.5; }
      .card    { fill: #16223b; stroke-width: 1.6; }
      .h1      { fill: #f1f5f9; font-size: 22px; font-weight: 700; }
      .h2      { fill: #e2e8f0; font-size: 15px; font-weight: 700; letter-spacing: .5px; }
      .t       { fill: #e2e8f0; font-size: 13.5px; font-weight: 600; }
      .s       { fill: #94a3b8; font-size: 12px; }
      .m       { fill: #cbd5e1; font-size: 11.5px; font-family: Consolas, Menlo, monospace; }
      .lbl     { fill: #cbd5e1; font-size: 12px; font-style: italic; }
      .warn    { fill: #fbbf24; font-size: 12px; font-weight: 600; }
      .badge   { fill: #a855f7; }
      .badgeT  { fill: #fff; font-size: 10.5px; font-weight: 700; }
      .flow    { fill: none; stroke-width: 2.4; stroke-linecap: round;
                 stroke-dasharray: 9 7; animation: dash 1.1s linear infinite; }
      .slow    { animation-duration: 2s; }
      .dashed  { fill: none; stroke-width: 1.8; stroke-dasharray: 4 5; animation: dash 2.4s linear infinite; }
      .ceph    { stroke: #22c55e; }
      .extra   { stroke: #a855f7; }
      .pve     { stroke: #3b82f6; }
      .prom    { stroke: #f97316; }
      .tool    { stroke: #eab308; }
      .pulse   { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes dash  { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
    <marker id="aCeph"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
    <marker id="aExtra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/></marker>
    <marker id="aPve"   viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="aProm"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
    <marker id="aTool"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eab308"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="880" rx="18"/>
  <text class="h1" x="30" y="50">Sơ đồ giám sát Proxmox + Ceph  ·  Prometheus → Grafana</text>
  <text class="s" x="30" y="70">Mũi tên chạy = chiều dữ liệu. Prometheus chủ động kéo (scrape) /metrics từ các exporter.</text>

  <!-- ===================== CỘT 1: CLUSTER ===================== -->
  <rect class="panel" x="30" y="90" width="430" height="570" rx="16"/>
  <text class="h2" x="50" y="120">CLUSTER PROXMOX + CEPH</text>
  <text class="s" x="50" y="138">mỗi cluster · exporter chạy trên 1 node Ceph</text>

  <!-- nguồn -->
  <rect class="card" x="50" y="160" width="150" height="90" rx="10" stroke="#22c55e"/>
  <text class="t" x="62" y="186">Ceph</text>
  <text class="s" x="62" y="205">MON · MGR · OSD</text>
  <text class="m" x="62" y="226">health, pgmap</text>
  <text class="m" x="62" y="241">osd, pool</text>

  <rect class="card" x="50" y="320" width="150" height="90" rx="10" stroke="#a855f7"/>
  <text class="t" x="62" y="346">/etc/pve/ha/</text>
  <text class="m" x="62" y="368">groups.cfg</text>
  <text class="m" x="62" y="384">rules.cfg</text>
  <text class="s" x="62" y="401">(node-affinity PVE 9)</text>

  <rect class="card" x="50" y="480" width="150" height="90" rx="10" stroke="#3b82f6"/>
  <text class="t" x="62" y="506">Proxmox API</text>
  <text class="m" x="62" y="528">:8006</text>
  <text class="m" x="62" y="544">/api2/json</text>
  <text class="s" x="62" y="561">node, VM, HA</text>

  <!-- exporter -->
  <rect class="card" x="250" y="150" width="190" height="110" rx="10" stroke="#22c55e"/>
  <text class="t" x="262" y="176">ceph-mgr prometheus</text>
  <text class="m" x="262" y="195" fill="#22c55e">:9283/metrics</text>
  <text class="m" x="262" y="216">ceph_health_status</text>
  <text class="m" x="262" y="232">ceph_osd_* · ceph_pool_*</text>
  <text class="m" x="262" y="248">ceph_cluster_*</text>

  <rect class="card" x="250" y="290" width="190" height="150" rx="10" stroke="#a855f7" stroke-width="2.4" filter="url(#glow)"/>
  <rect class="badge" x="392" y="298" width="40" height="18" rx="9"/>
  <text class="badgeT" x="412" y="311" text-anchor="middle">MỚI</text>
  <text class="t" x="262" y="316">pve_ceph_extra</text>
  <text class="t" x="262" y="333">_exporter</text>
  <text class="m" x="262" y="352" fill="#c084fc">:9284/metrics</text>
  <text class="m" style="font-size:10.5px" x="262" y="372">ceph_custom_recovery_info</text>
  <text class="m" style="font-size:10.5px" x="262" y="388">ceph_custom_recovery_percent</text>
  <text class="m" style="font-size:10.5px" x="262" y="404">ceph_custom_recovery_speed_*</text>
  <text class="m" style="font-size:10.5px" x="262" y="420">pve_ha_groups_custom_info</text>

  <rect class="card" x="250" y="470" width="190" height="110" rx="10" stroke="#3b82f6"/>
  <text class="t" x="262" y="496" style="font-size:12.5px">prometheus-pve-exporter</text>
  <text class="m" x="262" y="515" fill="#60a5fa">:9221/pve</text>
  <text class="m" x="262" y="536">pve_cluster_info</text>
  <text class="m" x="262" y="552">pve_cpu_* · pve_memory_*</text>
  <text class="m" x="262" y="568">pve_ha_state</text>

  <!-- nguồn → exporter -->
  <path id="pS1E1" class="flow ceph"  d="M200 195 L246 195" marker-end="url(#aCeph)"/>
  <path id="pS1E2" class="flow ceph"  d="M200 228 C228 228 222 330 246 330" marker-end="url(#aCeph)"/>
  <text class="lbl" x="56" y="272" style="font-size:11px">↳ ceph status -f json</text>
  <path id="pS2E2" class="flow extra" d="M200 375 L246 375" marker-end="url(#aExtra)"/>
  <path id="pS3E3" class="flow pve"   d="M200 525 L246 525" marker-end="url(#aPve)"/>

  <!-- systemd -->
  <rect class="card" x="50" y="600" width="390" height="44" rx="10" stroke="#eab308" stroke-dasharray="5 4"/>
  <text class="t" x="64" y="619" style="font-size:12.5px">systemd: pve-ceph-extra-exporter.service</text>
  <text class="s" x="64" y="636">cài bằng menu.sh (2) hoặc exporter/install_exporter.sh</text>
  <path class="dashed tool" d="M420 600 L420 444" marker-end="url(#aTool)"/>

  <!-- ===================== CỘT 2: PROMETHEUS ===================== -->
  <text class="lbl" x="495" y="160" text-anchor="middle">scrape</text>
  <text class="lbl" x="495" y="175" text-anchor="middle">/metrics</text>

  <rect class="panel" x="530" y="190" width="300" height="420" rx="16" stroke="#f97316"/>
  <text class="h2" x="550" y="220">PROMETHEUS</text>
  <text class="s" x="550" y="238">mỗi Site: FPT HCM · FPT HN · CMC-Q7</text>
  <text class="s" x="550" y="254">VIETTEL HCM · CMC HN</text>

  <rect x="548" y="270" width="264" height="214" rx="12" fill="#1a1f33" stroke="#f97316" stroke-dasharray="6 5"/>
  <text class="t" x="562" y="294">job: Proxmox-&lt;CLUSTER&gt;</text>

  <rect class="card" x="565" y="306" width="230" height="40" rx="8" stroke="#22c55e"/>
  <text class="m" x="578" y="331">node:9283   ceph mgr</text>
  <rect class="card" x="565" y="356" width="230" height="40" rx="8" stroke="#a855f7"/>
  <text class="m" x="578" y="381">node:9284   extra exporter</text>
  <rect class="card" x="565" y="406" width="230" height="40" rx="8" stroke="#3b82f6"/>
  <text class="m" x="578" y="431">host:9221   pve exporter</text>
  <text class="warn pulse" x="562" y="470">⚠ 3 target phải CÙNG 1 job</text>

  <text class="s" x="550" y="512">TSDB · scrape 30s</text>
  <text class="s" x="550" y="530">dashboard lọc theo job=~"$job"</text>
  <text class="m" x="550" y="556" fill="#fb923c">PromQL API :9090</text>
  <text class="s" x="550" y="590">menu.sh (10) in mẫu prometheus.yml</text>

  <!-- exporter → prometheus -->
  <path id="pE1" class="flow ceph"  d="M440 205 C495 205 505 326 561 326" marker-end="url(#aCeph)"/>
  <path id="pE2" class="flow extra" d="M440 376 C495 376 505 376 561 376" marker-end="url(#aExtra)"/>
  <path id="pE3" class="flow pve"   d="M440 525 C495 525 505 426 561 426" marker-end="url(#aPve)"/>

  <!-- ===================== CỘT 3: GRAFANA ===================== -->
  <rect class="panel" x="910" y="90" width="460" height="570" rx="16" stroke="#eab308"/>
  <text class="h2" x="930" y="120">GRAFANA</text>
  <text class="s" x="930" y="138">Dashboard “Proxmox - Ceph Prometheus”</text>

  <!-- biến -->
  <rect class="card" x="930" y="152" width="125" height="50" rx="25" stroke="#eab308"/>
  <text class="t" x="992" y="174" text-anchor="middle">$Site</text>
  <text class="s" x="992" y="191" text-anchor="middle">datasource</text>
  <rect class="card" x="1078" y="152" width="125" height="50" rx="25" stroke="#eab308"/>
  <text class="t" x="1140" y="174" text-anchor="middle">$job</text>
  <text class="s" x="1140" y="191" text-anchor="middle">pve_cluster_info</text>
  <rect class="card" x="1226" y="152" width="125" height="50" rx="25" stroke="#eab308"/>
  <text class="t" x="1288" y="174" text-anchor="middle">$class</text>
  <text class="s" x="1288" y="191" text-anchor="middle">ceph_osd_metadata</text>
  <path class="flow tool slow" d="M1055 177 L1074 177" marker-end="url(#aTool)"/>
  <path class="flow tool slow" d="M1203 177 L1222 177" marker-end="url(#aTool)"/>

  <!-- các row -->
  <g>
    <rect class="card" x="930" y="222" width="420" height="58" rx="10" stroke="#2a3a5c"/>
    <rect x="930" y="222" width="6" height="58" rx="3" fill="#22c55e"/>
    <text class="t" x="948" y="246">1 · Cluster State</text>
    <text class="m" x="948" y="267">health · alarms · capacity · PG · latency</text>

    <rect class="card" x="930" y="288" width="420" height="58" rx="10" stroke="#2a3a5c"/>
    <rect x="930" y="288" width="6" height="58" rx="3" fill="#22c55e"/>
    <text class="t" x="948" y="312">2 · OSD State</text>
    <text class="m" x="948" y="333">OUT · DOWN · UP · IN · Low/High · Used Class</text>
    <rect x="1258" y="298" width="82" height="18" rx="9" fill="#78350f"/>
    <text class="badgeT" x="1299" y="311" text-anchor="middle" fill="#fde68a">lặp $class</text>

    <rect class="card" x="930" y="354" width="420" height="58" rx="10" stroke="#2a3a5c"/>
    <rect x="930" y="354" width="6" height="29" rx="3" fill="#3b82f6"/>
    <rect x="930" y="383" width="6" height="29" rx="3" fill="#a855f7"/>
    <text class="t" x="948" y="378">3 · Proxmox Resource - HA Group</text>
    <text class="m" x="948" y="399">CPU · RAM · Uptime · HA · HA Groups</text>

    <rect class="card" x="930" y="420" width="420" height="58" rx="10" stroke="#2a3a5c"/>
    <rect x="930" y="420" width="6" height="58" rx="3" fill="#22c55e"/>
    <text class="t" x="948" y="444">4 · OSD Class / Ceph Pool Details</text>
    <text class="m" x="948" y="465">size · avail · %raw used · PG · stored · %used</text>

    <rect class="card" x="930" y="486" width="420" height="58" rx="10" stroke="#2a3a5c"/>
    <rect x="930" y="486" width="6" height="58" rx="3" fill="#22c55e"/>
    <text class="t" x="948" y="510">5 · Latency All OSD (High → Low)</text>
    <text class="m" x="948" y="531">nvme 15/25 · ssd 50/100 · hdd 100/200 ms</text>
    <rect x="1258" y="496" width="82" height="18" rx="9" fill="#78350f"/>
    <text class="badgeT" x="1299" y="509" text-anchor="middle" fill="#fde68a">lặp $class</text>

    <rect class="card" x="930" y="552" width="420" height="58" rx="10" stroke="#a855f7" stroke-width="2"/>
    <rect x="930" y="552" width="6" height="58" rx="3" fill="#a855f7"/>
    <text class="t" x="948" y="576">6 · Ceph Recovery &amp; Rebalance</text>
    <text class="m" x="948" y="597">Ceph Status · Total Health % · Recovery Speed</text>
  </g>
  <text class="s" x="930" y="640">Màu vạch trái = nguồn metric của row</text>

  <!-- prometheus → grafana -->
  <text class="lbl" x="870" y="372" text-anchor="middle">PromQL</text>
  <path id="pPG" class="flow prom" d="M830 390 C862 390 876 390 906 390" marker-end="url(#aProm)"/>

  <!-- ===================== BỘ TOOL ===================== -->
  <rect class="panel" x="30" y="690" width="1340" height="170" rx="16"/>
  <text class="h2" x="50" y="720">BỘ TOOL · repo monitor-grafana-proxmox-full</text>

  <rect class="card" x="50" y="740" width="230" height="90" rx="10" stroke="#eab308"/>
  <text class="t" x="64" y="766">make_dashboard.py</text>
  <text class="m" x="64" y="787">--site-regex --job-regex</text>
  <text class="m" x="64" y="803">--lat-th --ha-alias</text>
  <text class="s" x="64" y="820">menu.sh (9)</text>

  <rect class="card" x="330" y="740" width="230" height="90" rx="10" stroke="#eab308"/>
  <text class="t" x="344" y="766">proxmox_ceph_dashboard</text>
  <text class="t" x="344" y="783">.json</text>
  <text class="s" x="344" y="806">26 panel · biến Site/job/class</text>

  <rect class="card" x="610" y="740" width="260" height="90" rx="10" stroke="#eab308"/>
  <text class="t" x="624" y="766">Import Grafana API</text>
  <text class="m" x="624" y="787">POST /api/dashboards/db</text>
  <text class="s" x="624" y="806">menu.sh (11) · service token</text>

  <rect class="card" x="920" y="740" width="220" height="90" rx="10" stroke="#f97316" stroke-dasharray="5 4"/>
  <text class="t" x="934" y="766">Kiểm tra Prometheus</text>
  <text class="s" x="934" y="787">target up · job khớp ceph mgr</text>
  <text class="s" x="934" y="806">menu.sh (12) / (13)</text>

  <path id="pT1" class="flow tool" d="M280 785 L326 785" marker-end="url(#aTool)"/>
  <path id="pT2" class="flow tool" d="M560 785 L606 785" marker-end="url(#aTool)"/>
  <path id="pT3" class="flow tool" d="M740 740 C740 690 1120 710 1120 664" marker-end="url(#aTool)"/>
  <path class="dashed prom" d="M1030 740 C1030 680 700 680 700 614" marker-end="url(#aProm)"/>

  <!-- chú thích -->
  <g transform="translate(1170 735)">
    <text class="t" x="0" y="0" style="font-size:12.5px">Chú thích</text>
    <line x1="0" y1="18" x2="34" y2="18" class="flow ceph"/>  <text class="s" x="42" y="22">Ceph (mgr)</text>
    <line x1="0" y1="38" x2="34" y2="38" class="flow extra"/> <text class="s" x="42" y="42">extra exporter</text>
    <line x1="0" y1="58" x2="34" y2="58" class="flow pve"/>   <text class="s" x="42" y="62">Proxmox API</text>
    <line x1="0" y1="78" x2="34" y2="78" class="flow prom"/>  <text class="s" x="42" y="82">PromQL</text>
    <line x1="0" y1="98" x2="34" y2="98" class="flow tool"/>  <text class="s" x="42" y="102">tool / cài đặt</text>
  </g>

  <!-- gói dữ liệu chạy dọc mũi tên -->
  <g filter="url(#glow)">
    <circle r="4" fill="#4ade80"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#pE1"/></animateMotion></circle>
    <circle r="4" fill="#c084fc"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#pE2"/></animateMotion></circle>
    <circle r="4" fill="#60a5fa"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#pE3"/></animateMotion></circle>
    <circle r="3.5" fill="#4ade80"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#pS1E2"/></animateMotion></circle>
    <circle r="3.5" fill="#c084fc"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath xlink:href="#pS2E2"/></animateMotion></circle>
    <circle r="4.5" fill="#fb923c"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath xlink:href="#pPG"/></animateMotion></circle>
    <circle r="4.5" fill="#fb923c"><animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite"><mpath xlink:href="#pPG"/></animateMotion></circle>
    <circle r="4" fill="#facc15"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#pT3"/></animateMotion></circle>
  </g>
</svg>
